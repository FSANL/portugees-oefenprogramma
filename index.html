<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Português Comigo — Oefenprogramma Ivo</title>
<style>
  :root{
    --green:#0e8a5f;
    --green-light:#e6f6ef;
    --green-dark:#0a6b48;
    --red:#c0392b;
    --red-light:#fdecea;
    --ink:#1f2937;
    --muted:#6b7280;
    --line:#e5e7eb;
    --bg:#f7f8fa;
    --card:#ffffff;
    --amber:#b98900;
    --amber-light:#fdf3d8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.5;
  }
  header{
    background:linear-gradient(135deg,#0e8a5f,#0a6b48);
    color:#fff; padding:28px 20px 22px;
  }
  header h1{margin:0 0 4px; font-size:1.5rem;}
  header p{margin:0; opacity:.9; font-size:.95rem;}
  .wrap{max-width:880px; margin:0 auto; padding:0 20px;}
  nav.chapters{
    max-width:880px; margin:-16px auto 0; padding:0 20px; display:flex; gap:8px; flex-wrap:wrap;
  }
  nav.chapters button{
    border:none; background:#fff; color:var(--green-dark, #0a6b48); padding:8px 14px; border-radius:999px;
    font-size:.85rem; font-weight:600; cursor:pointer; box-shadow:0 1px 3px rgba(0,0,0,.12);
  }
  nav.chapters button.active{background:var(--green); color:#fff;}
  nav.chapters button.disabled{opacity:.5; cursor:not-allowed;}
  main{max-width:880px; margin:24px auto 60px; padding:0 20px;}
  .chapter-section{display:none;}
  .chapter-section.active{display:block;}
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:14px; padding:22px 24px; margin-bottom:20px;
  }
  .card h2{margin-top:0; font-size:1.15rem; display:flex; align-items:center; gap:8px;}
  .badge{
    display:inline-block; background:var(--green-light); color:var(--green-dark,#0a6b48); font-size:.7rem;
    font-weight:700; padding:3px 9px; border-radius:999px; text-transform:uppercase; letter-spacing:.03em;
  }
  table.vocab{width:100%; border-collapse:collapse; font-size:.92rem;}
  table.vocab td, table.vocab th{padding:6px 8px; border-bottom:1px solid var(--line); text-align:left;}
  table.vocab th{color:var(--muted); font-weight:600; font-size:.8rem; text-transform:uppercase;}
  details summary{cursor:pointer; font-weight:600; color:var(--green-dark,#0a6b48); margin-bottom:6px;}
  .item{margin-bottom:14px;}
  .item label, .item .prompt{display:block; margin-bottom:6px; font-size:.95rem;}
  .prompt .nl{color:var(--muted); font-style:italic; font-size:.85rem;}
  input[type=text], textarea{
    width:100%; padding:9px 11px; border:1.5px solid var(--line); border-radius:8px; font-size:.95rem;
    font-family:inherit; background:#fff;
  }
  input[type=text]:focus, textarea:focus{outline:none; border-color:var(--green);}
  textarea{min-height:56px; resize:vertical;}
  input.correct{border-color:var(--green); background:var(--green-light);}
  input.incorrect{border-color:var(--red); background:var(--red-light);}
  .feedback{font-size:.85rem; margin-top:4px;}
  .feedback.correct-text{color:var(--green-dark,#0a6b48);}
  .feedback.incorrect-text{color:var(--red);}
  .dialogue-line{margin-bottom:10px; font-size:.95rem;}
  .dialogue-line .who{font-weight:700; margin-right:4px;}
  .dialogue-line input{display:inline-block; width:160px; margin:0 4px;}
  .dialogue-line .nl-hint{display:block; color:var(--muted); font-style:italic; font-size:.82rem; margin-top:2px;}
  .conj-grid{display:grid; grid-template-columns:1fr repeat(4, 1fr); gap:8px; align-items:center; font-size:.88rem;}
  .conj-grid .head{font-weight:700; color:var(--muted); font-size:.78rem; text-transform:uppercase;}
  .conj-grid .verb-name{font-weight:700;}
  .actions{display:flex; gap:10px; flex-wrap:wrap; margin:24px 0;}
  button.primary{
    background:var(--green); color:#fff; border:none; padding:12px 22px; border-radius:10px; font-size:.95rem;
    font-weight:700; cursor:pointer;
  }
  button.secondary{
    background:#fff; color:var(--ink); border:1.5px solid var(--line); padding:12px 22px; border-radius:10px;
    font-size:.95rem; font-weight:600; cursor:pointer;
  }
  button.primary:hover{background:var(--green-dark,#0a6b48);}
  button.secondary:hover{border-color:var(--green);}
  .scoreBox{
    background:var(--amber-light); border:1px solid #f0dca0; border-radius:12px; padding:16px 20px; margin-bottom:20px;
    display:none; font-size:.95rem;
  }
  .scoreBox.show{display:block;}
  .exportBox{display:none; margin-top:14px;}
  .exportBox.show{display:block;}
  .exportText{min-height:220px; font-family:ui-monospace,Consolas,monospace; font-size:.8rem;}
  .hint{color:var(--muted); font-size:.85rem; margin-top:6px;}
  footer{max-width:880px; margin:0 auto 60px; padding:0 20px; color:var(--muted); font-size:.82rem;}
  .word-tag{display:inline-block; background:var(--green-light); color:var(--green-dark,#0a6b48); padding:2px 8px; border-radius:6px; font-size:.85rem; margin:2px 2px 2px 0;}
</style>
</head>
<body>

  </div>

<nav class="chapters" id="chaptersNav"></nav>

<main id="main"></main>

<footer>
  Português Comigo · Hoofdstukken worden bijgewerkt in het Claude-project "Portugees - Braziliaans" zodra nieuwe woorden/werkwoorden worden toegevoegd in Google Drive.
</footer>

<script>

// =========================================================================
// UTIL
// =========================================================================
function norm(s){
  return (s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/[^\w\s]/g,'').trim().replace(/\s+/g,' ');
}

// =========================================================================
// RENDER NAV
// =========================================================================
const nav = document.getElementById('chaptersNav');
chapters.forEach((ch, idx) => {
  const btn = document.createElement('button');
  btn.innerHTML = ch.title;
  btn.className = idx === 0 ? 'active' : '';
  btn.onclick = () => showChapter(ch.id);
  btn.id = `navbtn_${ch.id}`;
  nav.appendChild(btn);
});

function showChapter(id){
  document.querySelectorAll('.chapter-section').forEach(el => el.classList.remove('active'));
  document.getElementById(`chapter-${id}`).classList.add('active');
  chapters.forEach(ch => document.getElementById(`navbtn_${ch.id}`).classList.remove('active'));
  document.getElementById(`navbtn_${id}`).classList.add('active');
}

// =========================================================================

// =========================================================================

    </div>

      <h2>Oefening 5 <span class="badge">PT → NL vertalen</span></h2>

// =========================================================================
// GRADING
// =========================================================================
function checkField(inputEl, fbEl, accepted){
  const val = norm(inputEl.value);
  const ok = accepted.some(a => norm(a) === val) && val.length > 0;
  inputEl.classList.remove('correct','incorrect');
  if(!inputEl.value.trim()){
    fbEl.textContent = '';
    inputEl.classList.remove('correct','incorrect');
    return null;
  }
  if(ok){
    inputEl.classList.add('correct');
    fbEl.className = 'feedback correct-text';
    fbEl.textContent = '✓ Correct';
  } else {
    inputEl.classList.add('incorrect');
    fbEl.className = 'feedback incorrect-text';
    fbEl.textContent = `✗ Fout — juiste antwoord: "${accepted[0]}"`;
  }
  return ok;
}

const lastResultsByChapter = {};

function gradeAll(chId){
  const ch = chapters.find(c => c.id === chId);
  let total = 0, correct = 0;
  const wrong1 = [], wrong3 = [], wrong4 = [];

  ch.ex1.forEach((it, i) => {
    const input = document.getElementById(`c${chId}_e1_${i}`);
    const fb = document.getElementById(`c${chId}_e1_fb_${i}`);
    const ok = checkField(input, fb, it.accept);
    if(ok !== null){ total++; if(ok) correct++; else wrong1.push({item:it.prompt.replace('___', `[${input.value}]`), given:input.value, correct:it.accept[0]}); }
  });

  ch.ex3.forEach((line, i) => {
    if(!line.accept) return;
    const input = document.getElementById(`c${chId}_e3_${i}`);
    const fb = document.getElementById(`c${chId}_e3_fb_${i}`);
    const ok = checkField(input, fb, line.accept);
    if(ok !== null){ total++; if(ok) correct++; else wrong3.push({item:`${line.before}[...]${line.after}`, given:input.value, correct:line.accept[0]}); }
  });

  ch.ex4.forEach((v, vi) => {
    ['eu','você','nós','eles'].forEach(p => {
      const input = document.getElementById(`c${chId}_e4_${vi}_${p}`);
      const fb = document.getElementById(`c${chId}_e4_fb_${vi}_${p}`);
      const ok = checkField(input, fb, [v.forms[p]]);
      if(ok !== null){ total++; if(ok) correct++; else wrong4.push({item:`${v.verb} (${p})`, given:input.value, correct:v.forms[p]}); }
    });
  });

  lastResultsByChapter[chId] = {total, correct, wrong1, wrong3, wrong4};

  const scoreBox = document.getElementById(`scoreBox_${chId}`);
  scoreBox.classList.add('show');
  const pct = total ? Math.round((correct/total)*100) : 0;
  scoreBox.innerHTML = `<strong>Score automatisch controleerbare oefeningen: ${correct}/${total} (${pct}%)</strong><br>
    <span class="hint">Oefening 2 en 5 (en het open deel van oefening 3) worden door Claude nagekeken — gebruik de exportknop hieronder.</span>`;
  scoreBox.scrollIntoView({behavior:'smooth', block:'center'});
}

function buildExport(chId){
  const ch = chapters.find(c => c.id === chId);
  const chapterLabel = ch.title.replace(/&amp;/g,'&').replace(/<[^>]+>/g,'');
  const date = new Date().toLocaleDateString('nl-NL');
  let out = `PORTUGUÊS COMIGO — Export voor Claude-review\n${chapterLabel}\nDatum: ${date}\n\n`;

  const lastResults = lastResultsByChapter[chId];
  if(lastResults){
    out += `=== AUTOMATISCHE SCORE ===\n${lastResults.correct}/${lastResults.total} correct\n\n`;
    if(lastResults.wrong1.length){
      out += `Fouten Oefening 1 (invulzinnen):\n`;
      lastResults.wrong1.forEach(w => out += `- "${w.item}" — ingevuld: "${w.given}" | correct: "${w.correct}"\n`);
      out += '\n';
    }
    if(lastResults.wrong3.length){
      out += `Fouten Oefening 3 (gesprek):\n`;
      lastResults.wrong3.forEach(w => out += `- "${w.item}" — ingevuld: "${w.given}" | correct: "${w.correct}"\n`);
      out += '\n';
    }
    if(lastResults.wrong4.length){
      out += `Fouten Oefening 4 (werkwoordvervoegingen):\n`;
      lastResults.wrong4.forEach(w => out += `- ${w.item} — ingevuld: "${w.given}" | correct: "${w.correct}"\n`);
      out += '\n';
    }
  } else {
    out += `(Nog niet automatisch nagekeken — klik eerst op "Nakijken" voor de score van oefening 1, 3 en 4.)\n\n`;
  }

  out += `=== OEFENING 2 — Eigen zinnen (open, graag nakijken) ===\n`;
  ch.ex2.forEach((prompt, i) => {
    const val = document.getElementById(`c${chId}_e2_${i}`).value.trim();
    out += `${i+1}. Opdracht: ${prompt}\n   Antwoord: ${val || '(leeg)'}\n`;
  });

  out += `\n=== OEFENING 3 — Open zin (geen vaste vertaling) ===\n`;
  ch.ex3.forEach((line, i) => {
    if(line.accept) return;
    out += `- Vraag: "${line.before}${line.after}" (${line.nl})\n`;
  });

  out += `\n=== OEFENING 5 — PT → NL vertalingen (open, graag nakijken) ===\n`;
  ch.ex5.forEach((sentence, i) => {
    const val = document.getElementById(`c${chId}_e5_${i}`).value.trim();
    out += `${i+1}. PT: ${sentence}\n   Mijn vertaling: ${val || '(leeg)'}\n`;
  });

  out += `\nGraag: kijk oefening 2 en 5 na, leg fouten uit, en analyseer waar ik op moet oefenen. Stel me daarna de 10 extra oefeningen voor.\n`;

  document.getElementById(`exportText_${chId}`).value = out;
  const exportBox = document.getElementById(`exportBox_${chId}`);
  exportBox.classList.add('show');
  exportBox.scrollIntoView({behavior:'smooth', block:'start'});
}

function copyExport(chId){
  const ta = document.getElementById(`exportText_${chId}`);
  ta.select();
  navigator.clipboard.writeText(ta.value).then(() => {
    alert('Gekopieerd naar klembord! Plak dit in je Claude-chat.');
  }).catch(() => {
    document.execCommand('copy');
  });
}

function downloadExport(chId){
  const text = document.getElementById(`exportText_${chId}`).value;
  const blob = new Blob([text], {type:'text/plain'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `portugues-hoofdstuk${chId}-export.txt`;
  a.click();
  URL.revokeObjectURL(url);
}
</script>
